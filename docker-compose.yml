services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      DOCKER_WATCH_POLLING: "${DOCKER_WATCH_POLLING:-1}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-makhzan}:${POSTGRES_PASSWORD:-makhzan}@postgres:5432/${POSTGRES_DB:-makhzan}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-local-development-only-auth-secret-change-me}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
      AUTH_TRUSTED_ORIGINS: "${AUTH_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
    volumes:
      # Keep Linux dependencies and generated files off the host filesystem.
      - web_node_modules:/workspace/node_modules
      - web_next:/workspace/apps/web/.next
      - web_npm_cache:/home/node/.npm
      # Bind only editable inputs: no host .env, node_modules, or .next.
      - ./package.json:/workspace/package.json:ro
      - ./package-lock.json:/workspace/package-lock.json:ro
      - ./apps/web/package.json:/workspace/apps/web/package.json:ro
      - ./apps/web/auth.cli.ts:/workspace/apps/web/auth.cli.ts:ro
      - ./apps/web/next.config.ts:/workspace/apps/web/next.config.ts:ro
      - ./apps/web/tsconfig.json:/workspace/apps/web/tsconfig.json:ro
      - ./apps/web/eslint.config.mjs:/workspace/apps/web/eslint.config.mjs:ro
      - ./apps/web/vitest.unit.config.mts:/workspace/apps/web/vitest.unit.config.mts:ro
      - ./apps/web/vitest.http.config.mts:/workspace/apps/web/vitest.http.config.mts:ro
      - ./apps/web/vitest.db.config.mts:/workspace/apps/web/vitest.db.config.mts:ro
      - ./apps/web/vitest.auth.config.mts:/workspace/apps/web/vitest.auth.config.mts:ro
      - ./apps/web/drizzle.config.ts:/workspace/apps/web/drizzle.config.ts:ro
      # Drizzle Kit is the only tool expected to write generated migrations.
      - ./apps/web/drizzle:/workspace/apps/web/drizzle
      - ./apps/web/src:/workspace/apps/web/src:ro
      - ./apps/web/tests:/workspace/apps/web/tests:ro
      - ./apps/web/scripts:/workspace/apps/web/scripts:ro
      - ./apps/web/messages:/workspace/apps/web/messages:ro
      - ./apps/web/public:/workspace/apps/web/public:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/en/sign-in').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-makhzan}"
      POSTGRES_USER: "${POSTGRES_USER:-makhzan}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-makhzan}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-makhzan} -d ${POSTGRES_DB:-makhzan}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-test:
    profiles: ["database-test"]
    image: postgres:16
    environment:
      POSTGRES_DB: makhzan_test
      POSTGRES_USER: makhzan_test
      POSTGRES_PASSWORD: makhzan_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makhzan_test -d makhzan_test"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  redis:
    profiles: ["cache"]
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  web_node_modules:
  web_next:
  web_npm_cache:
  postgres_data:
