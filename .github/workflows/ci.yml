name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://makhzan_test:makhzan_test@127.0.0.1:5432/makhzan_test
      TEST_DATABASE_URL: postgresql://makhzan_test:makhzan_test@127.0.0.1:5432/makhzan_test
      BETTER_AUTH_SECRET: ci-only-auth-secret-for-isolated-automated-tests
      BETTER_AUTH_URL: https://ci.invalid
      AUTH_TRUSTED_ORIGINS: https://ci.invalid
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: makhzan_test
          POSTGRES_USER: makhzan_test
          POSTGRES_PASSWORD: makhzan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U makhzan_test -d makhzan_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Report dependency findings and block high or critical severity
        run: npm audit --audit-level=high

      - name: Check migration consistency
        run: npm run db:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Unit and Component Tests
        run: npm run test:unit

      - name: Run PostgreSQL Integration Tests
        run: npm run test:db
        env:
          NODE_ENV: test

      - name: Run Authentication Integration Tests
        run: npm run test:auth
        env:
          NODE_ENV: test

      - name: Run Tenant Authorization Integration Tests
        run: npm run test:tenancy
        env:
          NODE_ENV: test

      - name: Build production application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run HTTP Integration Tests
        run: npm run test:http
